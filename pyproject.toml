[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "flashrank>=0.2.10",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.2",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pyside6>=6.11.1",
    "qdrant-client>=1.18.0",
    "typer>=0.25.1",
    "uvicorn>=0.48.0",
]

[project.scripts]
agent-test = "backend.test.test:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"backend" = "."}